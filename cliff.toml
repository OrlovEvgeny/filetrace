# Release notes and CHANGELOG.md, generated from the commit subjects.

[changelog]
header = """
# Changelog

Every release of Filetrace, newest first. A version reads year.month.patch.build.
"""
body = """

{% if version -%}
## {{ version | trim_start_matches(pat="v") | split(pat="-") | first }} ({{ timestamp | date(format="%Y-%m-%d") }})
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/OrlovEvgeny/filetrace/commit/{{ commit.id }}))
{% endfor -%}
{% endfor -%}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# A candidate (-prestable) opens no section: its commits belong to the release that follows.
tag_pattern = "^v[0-9]{2}\\.[0-9]+\\.[0-9]+\\.[0-9]+-(stable|lts)$"
sort_commits = "oldest"
commit_parsers = [
    { message = "^[a-z]+!:", group = "<!-- 0 -->Backward Incompatible Change" },
    { message = "^feat", group = "<!-- 1 -->New Feature" },
    { message = "^perf", group = "<!-- 2 -->Performance Improvement" },
    { message = "^fix", group = "<!-- 3 -->Bug Fix" },
    { message = ".*", skip = true },
]
