user www-data;
worker_processes 1;
pid /run/acceptance-nginx.pid;
error_log /tmp/nginx.err;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    server {
        listen 127.0.0.1:39711 ssl;
        http2 on;
        ssl_certificate /opt/ft-acceptance/tls/server.pem;
        ssl_certificate_key /opt/ft-acceptance/tls/server.key;
        root /data/acceptance;
        sendfile on;
    }
    server {
        listen 127.0.0.1:39712 ssl;
        ssl_certificate /opt/ft-acceptance/tls/server.pem;
        ssl_certificate_key /opt/ft-acceptance/tls/server.key;
        root /data/acceptance;
        sendfile on;
    }
}
