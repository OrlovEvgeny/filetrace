name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: A new line cut from master, or a patch of an existing line
        required: true
        type: choice
        options:
          - new
          - patch
      ref:
        description: Branch, tag or commit to release
        required: true
        default: master
        type: string
      channel:
        description: default is stable for a new line and the line's own channel for a patch
        required: true
        default: default
        type: choice
        options:
          - default
          - lts
          - prestable
      dry_run:
        description: Build and check everything, publish nothing
        required: true
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      channel: ${{ steps.next.outputs.channel }}
      line: ${{ steps.next.outputs.line }}
      commit: ${{ steps.next.outputs.commit }}
      previous: ${{ steps.next.outputs.previous }}
      latest: ${{ steps.next.outputs.latest }}
      prerelease: ${{ steps.next.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compute the version
        id: next
        env:
          TYPE: ${{ inputs.type }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -- next "$TYPE" --ref HEAD
          [ "$CHANNEL" = default ] || set -- "$@" --channel "$CHANNEL"
          tools/release/version.sh "$@" | tee -a "$GITHUB_OUTPUT"
      - name: Require the commit to be on the branch it is released from
        env:
          TYPE: ${{ inputs.type }}
          LINE: ${{ steps.next.outputs.line }}
        run: |
          branch=master
          [ "$TYPE" = new ] || branch=$LINE
          if ! git merge-base --is-ancestor HEAD "origin/$branch"; then
              echo "::error::the commit is not on $branch"
              exit 1
          fi

  checks:
    name: Checks
    needs: plan
    uses: $/.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
      version: ${{ needs.plan.outputs.version }}

  publish:
    name: Publish
    needs: [plan, checks]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # tags the commit and publishes the release
      id-token: write # signs the attestations
      attestations: write # stores the attestations
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      LINE: ${{ needs.plan.outputs.line }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      LATEST: ${{ needs.plan.outputs.latest }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      SIGNED: ${{ secrets.FILETRACE_GPG_KEY != '' && secrets.FILETRACE_APK_KEY != '' }}
      HOSTED: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_BUCKET_NAME != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
      TAPPED: ${{ secrets.HOMEBREW_TAP_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stage-*
          path: dist/stage
      - name: Name the staged trees after their platforms
        run: |
          for tree in dist/stage/stage-*; do
              mv "$tree" "dist/stage/${tree#dist/stage/stage-}"
          done
      - uses: $/.github/actions/mise

      # The deb packages and the archives are the files the checks installed.
      # rpm and apk carry their signature inside, so those are packed again.
      - name: Sign the rpm and apk packages
        if: env.SIGNED == 'true'
        env:
          GPG_KEY: ${{ secrets.FILETRACE_GPG_KEY }}
          APK_KEY: ${{ secrets.FILETRACE_APK_KEY }}
          FILETRACE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          keys=$RUNNER_TEMP/keys
          mkdir -m 700 "$keys"
          printf '%s\n' "$GPG_KEY" >"$keys/gpg.key"
          printf '%s\n' "$APK_KEY" >"$keys/filetrace.rsa"
          FILETRACE_GPG_KEY_FILE=$keys/gpg.key FILETRACE_APK_KEY_FILE=$keys/filetrace.rsa \
              tools/dist/package.sh "$RUNNER_TEMP/signed"
          rm -rf "$keys"
          cp "$RUNNER_TEMP"/signed/*.rpm "$RUNNER_TEMP"/signed/*.apk dist/
      - name: Warn about unsigned packages
        if: env.SIGNED != 'true'
        run: echo "::warning::no signing keys are set, so the rpm and apk packages are unsigned"

      - name: Write the checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz ./*.deb ./*.rpm ./*.apk install.sh | sed 's|  \./|  |' >SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Write the release notes
        run: tools/release/notes.sh "$TAG" "$PREVIOUS" "$COMMIT" >"$RUNNER_TEMP/notes.md"

      - name: Tag the commit
        run: |
          if tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2>/dev/null); then
              if [ "$tagged" != "$COMMIT" ]; then
                  echo "::error::$TAG already names $tagged"
                  exit 1
              fi
              exit 0
          fi
          object=$(gh api "repos/$GH_REPO/git/tags" -f tag="$TAG" -f message="Filetrace $VERSION" \
              -f object="$COMMIT" -f type=commit --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" --silent

      # Assets cannot change once a release is public, so it is filled as a draft.
      - name: Publish the release
        run: |
          set -- --latest=false
          [ "$LATEST" != true ] || set -- --latest
          [ "$PRERELEASE" != true ] || set -- "$@" --prerelease
          if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --verify-tag --draft --title "Filetrace $VERSION" \
                  --notes-file "$RUNNER_TEMP/notes.md" "$@"
          fi
          gh release upload "$TAG" --clobber dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.apk \
              dist/install.sh dist/SHA256SUMS
          gh release edit "$TAG" --draft=false "$@"

      - name: Open the branch of a new line
        if: inputs.type == 'new' && needs.plan.outputs.prerelease != 'true'
        run: |
          if ! gh api "repos/$GH_REPO/git/ref/heads/$LINE" --silent 2>/dev/null; then
              gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$LINE" -f sha="$COMMIT" --silent
          fi

      # The site is built from what is public, so it serves the very files of the release.
      - name: Publish the download site
        id: site
        if: env.SIGNED == 'true' && env.HOSTED == 'true'
        uses: $/.github/actions/site
        with:
          gpg-key: ${{ secrets.FILETRACE_GPG_KEY }}
          apk-key: ${{ secrets.FILETRACE_APK_KEY }}
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-bucket-name: ${{ secrets.R2_BUCKET_NAME }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Warn about a download site left as it is
        if: env.SIGNED != 'true' || env.HOSTED != 'true'
        run: echo "::warning::the signing keys or the R2 credentials are not set, so the download site is left as it is"

      - name: Check out the Homebrew tap
        if: env.TAPPED == 'true' && needs.plan.outputs.latest == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
          path: tap
          # The key reaches the tap alone and is needed for the push below.
          persist-credentials: true # zizmor: ignore[artipacked]
      - name: Update the Homebrew formula
        if: env.TAPPED == 'true' && needs.plan.outputs.latest == 'true'
        run: |
          mkdir -p tap/Formula
          tools/release/formula.sh "$VERSION" "$TAG" dist/SHA256SUMS >tap/Formula/filetrace.rb
          cd tap
          git add Formula/filetrace.rb
          if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  commit --quiet --message "filetrace $VERSION"
              git push --quiet
          fi

  changelog:
    name: Propose the changelog entry
    needs: [plan, publish]
    if: needs.plan.outputs.prerelease != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # pushes the branch with the entry
      pull-requests: write # opens the pull request
      actions: write # starts the checks on that branch
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          # The branch with the entry is pushed with this token.
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: $/.github/actions/mise
      - name: Open a pull request with the entry
        run: |
          branch=docs/changelog-$VERSION
          git switch --create "$branch"
          git-cliff --tag "$TAG" --prepend CHANGELOG.md "${PREVIOUS:+$PREVIOUS..}$COMMIT"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet --message "docs: record the $VERSION changelog" CHANGELOG.md
          git push --quiet --force origin "$branch"
          gh pr create --base master --head "$branch" \
              --title "docs: record the $VERSION changelog" \
              --body "Adds the notes of [$TAG](https://github.com/$GH_REPO/releases/tag/$TAG) to CHANGELOG.md."
          # A pull request opened with this token starts no workflow by itself.
          gh workflow run ci.yml --ref "$branch"
