version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/mise
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /tools/dev
      - /tools/dev/vm
      - /tools/dist
      - /tests/packaging/images
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      images:
        patterns: ["*"]
