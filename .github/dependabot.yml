version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/mise
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /tools/dev
      - /tools/dev/vm
      - /tools/dev/vm/x86_64
      - /tools/dev/vm/x86_64/qemu
      - /tools/dist
      - /tests/packaging/images
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      images:
        patterns: ["*"]
    # Moving to another release of a distribution is a decision, not an update.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
