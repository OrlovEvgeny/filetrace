name: Publish the download site
description: Builds the download site from every published release, with signed apt, yum and apk repositories, and uploads it to the R2 bucket that serves it. Needs the tools of mise.

inputs:
  gpg-key:
    description: OpenPGP private key, ASCII-armored
    required: true
  apk-key:
    description: RSA private key in PEM format
    required: true
  r2-account-id:
    description: Cloudflare account that owns the bucket
    required: true
  r2-bucket-name:
    description: Bucket that serves the site
    required: true
  r2-access-key-id:
    description: Access key of an R2 API token that may write the objects of the bucket
    required: true
  r2-secret-access-key:
    description: Secret of that access key
    required: true

runs:
  using: composite
  steps:
    - name: Build the site
      shell: sh
      env:
        GPG_KEY: ${{ inputs.gpg-key }}
        APK_KEY: ${{ inputs.apk-key }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        keys=$RUNNER_TEMP/site-keys
        mkdir -m 700 "$keys"
        printf '%s\n' "$GPG_KEY" >"$keys/gpg.key"
        printf '%s\n' "$APK_KEY" >"$keys/filetrace.rsa"
        tools/release/fetch.sh "$RUNNER_TEMP/releases"
        FILETRACE_GPG_KEY_FILE=$keys/gpg.key FILETRACE_APK_KEY_FILE=$keys/filetrace.rsa \
            tools/release/site.sh "$RUNNER_TEMP/releases" "$RUNNER_TEMP/site"
        rm -rf "$keys"
    - name: Upload the site
      shell: sh
      env:
        R2_ACCOUNT_ID: ${{ inputs.r2-account-id }}
        R2_BUCKET_NAME: ${{ inputs.r2-bucket-name }}
        R2_ACCESS_KEY_ID: ${{ inputs.r2-access-key-id }}
        R2_SECRET_ACCESS_KEY: ${{ inputs.r2-secret-access-key }}
      run: tools/release/deploy.sh "$RUNNER_TEMP/site"
