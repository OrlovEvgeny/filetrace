name: Build the download site
description: Indexes the packages of every published release into signed apt, yum and apk repositories and uploads the result for GitHub Pages

inputs:
  gpg-key:
    description: OpenPGP private key, ASCII-armored
    required: true
  apk-key:
    description: RSA private key in PEM format
    required: true

runs:
  using: composite
  steps:
    - name: Build the site
      shell: sh
      env:
        GPG_KEY: ${{ inputs.gpg-key }}
        APK_KEY: ${{ inputs.apk-key }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        keys=$RUNNER_TEMP/site-keys
        mkdir -m 700 "$keys"
        printf '%s\n' "$GPG_KEY" >"$keys/gpg.key"
        printf '%s\n' "$APK_KEY" >"$keys/filetrace.rsa"
        tools/release/fetch.sh "$RUNNER_TEMP/releases"
        FILETRACE_GPG_KEY_FILE=$keys/gpg.key FILETRACE_APK_KEY_FILE=$keys/filetrace.rsa \
            tools/release/site.sh "$RUNNER_TEMP/releases" "$RUNNER_TEMP/site"
        rm -rf "$keys"
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ runner.temp }}/site
