# Filetrace agent configuration.
#
# Every setting is listed with its built-in default. Uncomment a line to change
# it, then restart the agent: the file is read once, when the agent starts.
#
#   filetrace config validate    checks this file
#   filetrace config show        prints the values in effect

[agent]
# enabled = true
# "minimal" records processes, sockets and byte counts only.
# mode = "standard"
# "auto", "trampoline" or "kprobe".
# probes = "auto"
# socket = "/run/filetrace/agent.sock"
# Kernel-to-agent event queue; 1MB by default in minimal mode.
# ring_buffer_size = "4MB"
# Counters read from the kernel per call.
# event_batch_size = 512
# flush_interval = "250ms"
# Memory for the log of recent events; 0 keeps none. 256KB by default in minimal mode.
# event_log_size = "1MB"
# "error", "warn", "info" or "debug".
# log_level = "info"

[network]
# tcp = true
# udp = true
# ipv4 = true
# ipv6 = true

[file]
# Attribution of files a thread reads and then sends.
# track_read = true
# Attribution of files sent with sendfile.
# track_sendfile = true

[correlation]
# enabled = true
# Longest read-to-send gap that still associates a file with a send.
# window = "2s"
# "exact" reports sendfile transfers only.
# confidence_threshold = "inferred"
# inferred_min_bytes = "1KB"
# inferred_min_percent = 5
# Files whose read-write transfers are reported at any size, below the two
# minimums above, such as "/home/*/.ssh/*". '*' matches any run of characters.
# no_minimum_paths = []
# Files that programs read on their way to a connection and that nobody sends by
# reading them: trust stores, resolver files, time zones, locale data, interpreter
# configuration, compiled modules, data files libraries load as they start, and
# what a JVM loads from its JDK. Reading one does not change what the thread is
# sending, and it is never taken as sent from a read and a send; sendfile of one
# is still reported.
# "*/name" and "*.ext" name such files wherever they are, from their first read.
# A file counts once a pattern names it: when the agent starts, every 30 seconds,
# and after the first read of its path, also inside a container. [] turns this off.
# background_paths = ["/etc/ssl/certs/*", "/etc/ssl/cert.pem", "/etc/pki/tls/certs/*", "/etc/pki/ca-trust/extracted/*", "/etc/ca-certificates/extracted/*", "/usr/share/ca-certificates/*", "/usr/local/share/ca-certificates/*", "/etc/pki/ca-trust/source/*", "/usr/share/pki/ca-trust-source/*", "/etc/pki/trust/*", "/usr/share/pki/trust/*", "/etc/ca-certificates/trust-source/*", "/etc/ssl/openssl.cnf", "/etc/pki/tls/openssl.cnf", "/usr/lib/ssl/openssl.cnf", "/etc/php/*", "*/php.ini", "/etc/hosts", "/etc/host.conf", "/etc/resolv.conf", "/etc/nsswitch.conf", "/etc/gai.conf", "/etc/mime.types", "/usr/share/zoneinfo/*", "/etc/localtime", "/usr/lib/locale/*", "*.mo", "*.pyc", "*/cacert.pem", "*/cacerts", "*/ca-bundle.crt", "*/ca-certificates.crt", "*/endpoints.json", "*/partitions.json", "*/sdk-default-configuration.json", "*/service-2.json", "*/service-2.json.gz", "*/endpoint-rule-set-1.json", "*/endpoint-rule-set-1.json.gz", "/usr/lib/jvm/*", "/usr/lib64/jvm/*", "/usr/java/*", "/usr/local/openjdk-*", "/opt/java/*", "/etc/java*", "*/modules", "*/libnet.so", "*/libnio.so", "*/libextnet.so", "*/libjimage.so", "*/net.properties", "*/java.security", "*.policy", "*.jsa"]
# Files that programs load as they run and that people also send: account
# databases, modules, shared libraries. Reading one does not change what the thread
# is sending either; it is taken as sent only when what a connection took matches
# its size, and, when it was read before the connection was opened, only when it
# went before the peer answered. Matched as background_paths is.
# strict_paths = ["/etc/passwd", "/etc/group", "*.py", "*.rb", "*.js", "*.mjs", "*.cjs", "*.node", "*.jar", "*.class", "*.pm", "*.pl", "*.php", "*.so", "*.so.*"]

# Entries per table; the least recently used go first.
[limits]
# processes = 4096
# sockets = 16384
# flows = 16384
# files = 16384
# transfers = 16384
# kernel_counters = 16384
# kernel_files = 16384
# Label sets of the exported counters.
# metric_series = 2048

[output]
# Default format of the listing commands.
# format = "table"
# timestamps = true

[filters]
# exclude_processes = []
# exclude_paths = []

# What is kept of each process: its command line, working directory and, for an
# interpreter, the script it runs.
[process]
# Arguments can hold passwords and tokens. false keeps only the program in the
# command line; the script is still named.
# arguments = true
# Probes the PHP binaries that processes run, in containers too, for the script
# of each request: a PHP-FPM or mod_php worker's transfers name the request's
# script instead of the pool. About a microsecond per request.
# php_scripts = true
# The PHP probes follow each request to its end with a return probe. A test at
# start runs a process under a seccomp filter through one; where it is killed,
# as on x86-64 kernels 6.11 to 6.12.13 and 6.13 to 6.13.2 under the filter of a
# container runtime, the PHP probes are not attached. true attaches them anyway,
# for a host whose PHP processes run under no seccomp filter.
# force_return_probes = false

# A page of metrics for Prometheus to scrape, served without authentication.
[prometheus]
# enabled = false
# listen = "127.0.0.1:9464"

# Events and metrics pushed to an OpenTelemetry collector over gRPC without TLS.
[otlp]
# enabled = false
# A numeric address and port, or a "unix:" path.
# endpoint = "127.0.0.1:4317"
# logs = true
# metrics = true
# events = ["file_transfer", "event_loss"]
# file_paths = true
# Arguments can hold passwords and tokens, and the records leave this host.
# command_line = false
# Records per request.
# batch_size = 1024
# flush_interval = "5s"
# metrics_interval = "30s"
# timeout = "10s"

# An API that lists and streams transfers. A "unix:" socket admits root and the
# agent's user; an address and port admits anyone who can reach it.
[grpc]
# enabled = false
# listen = "unix:/run/filetrace/api.sock"
